name: SecurityKane Gitleaks Composite Action
description: Run gitleaks and produce a merged JSON report with metadata
runs:
  using: composite
  steps:

    - name: Install gitleaks and jq
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y jq curl
        GITLEAKS_VERSION="${GITLEAKS_VERSION:-v8.18.4}"
        VERSION_NO_V="${GITLEAKS_VERSION#v}"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
          -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${VERSION_NO_V}_linux_x64.tar.gz"
        tar -xzf gitleaks.tar.gz gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run gitleaks (git history)
      shell: bash
      run: |
        set -euo pipefail
        echo "=== DEBUG: Git commit history ==="
        git log --oneline --all
        echo "=== DEBUG: Current commit ==="
        git rev-parse HEAD
        echo "=== DEBUG: Checking for specific commit 901be21768b8bc0a67b4534cd67bfb629f51738b ==="
        git log --oneline | grep 901be21 || echo "Commit 901be21 not found"
        echo "=== DEBUG: Checking if jira_test.py exists ==="
        ls -la jira_test.py || echo "File not found"
        echo "=== DEBUG: Git history for jira_test.py ==="
        git log --oneline --all -- jira_test.py || echo "No history for jira_test.py"
        echo "=== DEBUG: Checking for gitleaks config files ==="
        ls -la .gitleaks* 2>/dev/null || echo "No .gitleaks config files found"
        ls -la gitleaks.toml 2>/dev/null || echo "No gitleaks.toml found"
        echo "=== DEBUG: Content of jira_test.py at current HEAD ==="
        head -20 jira_test.py
        echo "=== DEBUG: Checking if secret string is in the file ==="
        grep -i "ATATT3" jira_test.py || echo "Secret string NOT found in file"
        echo "=== DEBUG: Git status ==="
        git status
        echo "=== DEBUG: Testing gitleaks with --log-opts ==="
        gitleaks detect --source . --no-color --report-format=json --report-path gitleaks_test.json --exit-code 0 --log-opts="--all" --verbose 2>&1 || true
        echo "=== DEBUG: Test results ==="
        cat gitleaks_test.json 2>/dev/null || echo "No test results"
        echo "=== DEBUG: Running gitleaks on unstaged files ==="
        gitleaks protect --source . --no-color --report-format=json --report-path gitleaks_protect.json --exit-code 0 --verbose 2>&1 || true
        echo "=== DEBUG: Protect results ==="
        cat gitleaks_protect.json 2>/dev/null || echo "No protect results"
        echo "=== DEBUG: Running gitleaks detect (original command) ==="
        gitleaks detect --source . --no-color --report-format=json --report-path gitleaks.json --exit-code 0 --verbose 2>&1 || true
        test -s gitleaks.json || echo "[]" > gitleaks.json
        echo "=== DEBUG: Raw gitleaks output ==="
        cat gitleaks.json | jq '.'
        echo "=== DEBUG: Number of findings ==="
        cat gitleaks.json | jq 'length'

    - name: Merge findings
      shell: bash
      run: |
        set -euo pipefail
        jq -s 'map(if type=="array" then . else [] end) | add' gitleaks.json > findings.json
        echo "=== DEBUG: After jq merge ==="
        cat findings.json | jq '.'
        echo "=== DEBUG: Number of findings after merge ==="
        cat findings.json | jq 'length'

    - name: Build merged JSON
      shell: bash
      env:
        SK_TENANT_ID: ${{ env.SK_TENANT_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail
        GEN_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        jq -n \
          --arg tenant_id "${SK_TENANT_ID:-}" \
          --arg repository "${GITHUB_REPOSITORY}" \
          --arg commit_sha "${GITHUB_SHA}" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
          --arg ref "${GITHUB_REF}" \
          --arg ref_name "${GITHUB_REF_NAME}" \
          --arg actor "${GITHUB_ACTOR}" \
          --arg run_url "${RUN_URL}" \
          --arg generated_at "${GEN_AT}" \
          --slurpfile findings findings.json \
          '{
            tenant_id: $tenant_id,
            repository: $repository,
            commit_sha: $commit_sha,
            run_id: $run_id,
            run_attempt: $run_attempt,
            ref: $ref,
            ref_name: $ref_name,
            actor: $actor,
            run_url: $run_url,
            generated_at: $generated_at,
            findings: $findings[0]
          }' > securitykane_gitleaks.json
        echo "=== DEBUG: Final output ==="
        cat securitykane_gitleaks.json | jq '.findings | length'

    - name: Generate local artifact
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-results
        path: securitykane_gitleaks.json
        if-no-files-found: error

    - name: Post to backend and upload to S3
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        # Check if OIDC token URL is available (requires 'id-token: write' permission)
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is not set."
          echo "Ensure your workflow has 'permissions: id-token: write' configured."
          echo ""
          echo "Example workflow configuration:"
          echo "  permissions:"
          echo "    id-token: write"
          echo "    contents: read"
          exit 1
        fi

        # Get OIDC token
        OIDC_TOKEN=$(curl -fsSL --retry 3 --retry-all-errors \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=securitykane" \
          | jq -r '.value')

        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
          echo "ERROR: Failed to obtain OIDC token from GitHub Actions"
          exit 1
        fi

        # Request presigned URL with retry
        for i in 1 2 3; do
          RESPONSE=$(curl -fsSL --connect-timeout 10 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${OIDC_TOKEN}\",\"repository\":\"${GITHUB_REPOSITORY}\"}" \
            https://anamaria-deathful-ungeodetically.ngrok-free.dev/api/integrations/github/tenant-info/ 2>&1) && break
          [ $i -lt 3 ] && sleep $((2**i)) || { echo "ERROR: Failed to get presigned URL: $RESPONSE"; exit 1; }
        done

        # Validate and extract presigned URL
        S3_URL=$(echo "$RESPONSE" | jq -r '.presigned_url')
        if [ -z "$S3_URL" ] || [ "$S3_URL" = "null" ]; then
          echo "ERROR: Invalid presigned URL in response: $RESPONSE"
          exit 1
        fi

        # Upload to S3
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 -X PUT \
          --data-binary @securitykane_gitleaks.json \
          -H "Content-Type: application/json" \
          "${S3_URL}"
